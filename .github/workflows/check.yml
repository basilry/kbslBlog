name: Blog checks

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/counter-worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: cloudflare/counter-worker
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
        working-directory: cloudflare/counter-worker
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
